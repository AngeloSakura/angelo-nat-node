name: Validate and package
on:
  push:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  master-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Real isolated master independent-update preservation
        shell: bash
        run: sudo bash scripts/test-master-live.sh | tee /tmp/master-live.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-live-validation
          path: /tmp/master-live.txt
  master-node-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build and connect unchanged master to lightweight node
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/angelo-node ./cmd/angelo-node
          sudo bash scripts/test-master-node-live.sh /tmp/angelo-node | tee /tmp/master-node-live.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-node-live-validation
          path: /tmp/master-node-live.txt
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Fetch unchanged official Xray
        run: |
          mkdir -p /tmp/angelo-xray
          curl -fL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-linux-64.zip -o /tmp/angelo-xray/xray.zip
          echo 'e4bd9119f50ae7c41658b1abd0679ae06f98bd864a2907ff33f2f2cf7081b214  /tmp/angelo-xray/xray.zip' | sha256sum -c -
          unzip -q /tmp/angelo-xray/xray.zip -d /tmp/angelo-xray
          chmod +x /tmp/angelo-xray/xray
      - name: Vet and race-tested official Xray integration
        env:
          XRAY_BINARY: /tmp/angelo-xray/xray
        run: |
          go vet ./...
          go test -race -count=1 -v ./... | tee /tmp/go-tests.txt
      - name: Shell syntax and master update preservation
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          sh -n scripts/angelo-node.openrc
          if [ -f scripts/test-update-master.sh ]; then bash scripts/test-update-master.sh; fi
          if [ -f scripts/test-update-node.sh ]; then sudo bash scripts/test-update-node.sh; fi
          bash scripts/test-install.sh
          bash scripts/test-migrate-v0.1.0.sh
      - name: Build binaries off the NAT VPS
        run: bash scripts/package.sh
      - name: Smoke-test packaged Linux executable and checksums
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          tar -xOzf dist/angelo-node-linux-amd64.tar.gz x-ui > /tmp/package-x-ui
          chmod 755 /tmp/package-x-ui
          test "$(/tmp/package-x-ui -version)" = v0.1.9
          tar -tzf dist/angelo-node-linux-amd64.tar.gz | grep -Fx angelo-node.openrc
      - name: Test 64 and 128 MiB process cgroups
        run: sudo python3 scripts/memory-test.py dist/angelo-node-linux-amd64 /tmp/angelo-xray/xray | tee /tmp/memory-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-and-packages
          path: |
            dist/
            /tmp/go-tests.txt
            /tmp/memory-results.json
          retention-days: 14
